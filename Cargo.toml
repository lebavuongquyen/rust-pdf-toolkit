[package]
name = "pdffiller"
version = "0.2.0"
edition = "2024"

[lib]
name = "pdffiller_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pdffiller"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
lopdf = "0.45.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
getrandom = { version = "0.2", features = ["js"] }
getrandom_v4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
sha2 = "0.10.9"
hmac = "0.12.1"
aes-gcm = "0.10.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rsa = { version = "0.9.10", features = ["sha2"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pkcs8"] }
signature = "2.2.0"
time = { version = "0.3.55", features = ["formatting"] }
x509-parser = "0.18.0"
