[package]
name = "pdffiller"
version = "0.2.0"
edition = "2024"

[lib]
name = "pdffiller_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pdffiller"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
lopdf = "0.45.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdfluent-sign = "1.0.0"

